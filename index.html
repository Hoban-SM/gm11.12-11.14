<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>호반써밋 엘리트시티 방문예약</title>
<style>
  :root {
    --navy: #334464;
    --navy-dark: #22304a;
    --white: #ffffff;
    --gray-bg: #f4f6f9;
    --gray-border: #dde2ea;
    --text: #22283a;
    --text-sub: #6b7280;
    --full: #c7ccd4;
    --ok: #2e7d32;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--gray-bg);
    color: var(--text);
  }
  header {
    background: var(--navy);
    color: var(--white);
    padding: 24px 20px 20px;
    text-align: center;
  }
  header h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: -0.5px; }
  header p { margin: 0; font-size: 13px; opacity: 0.85; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 16px; padding-bottom: 100px; }
  .card {
    background: var(--white);
    border: 1px solid var(--gray-border);
    border-radius: 14px;
    padding: 18px;
    margin-top: 14px;
  }
  .info-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .info-table th {
    width: 72px; text-align: left; color: var(--text-sub); font-weight: 600;
    padding: 6px 4px; vertical-align: top;
  }
  .info-table td { padding: 6px 4px; }
  .section-title {
    font-size: 15px; font-weight: 700; margin: 0 0 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .section-title .badge {
    background: var(--navy); color: #fff; font-size: 11px;
    padding: 2px 8px; border-radius: 999px; font-weight: 600;
  }
  .date-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .date-tab {
    flex: 1; text-align: center; padding: 10px 4px; border-radius: 10px;
    border: 1px solid var(--gray-border); background: var(--white);
    cursor: pointer; font-size: 13px; font-weight: 600; color: var(--text-sub);
  }
  .date-tab.active { background: var(--navy); border-color: var(--navy); color: #fff; }
  .slot-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .slot {
    border: 1.5px solid var(--gray-border); border-radius: 10px;
    padding: 10px 6px; text-align: center; cursor: pointer; background: #fff;
  }
  .slot .time { font-size: 13.5px; font-weight: 700; }
  .slot .remain { font-size: 11.5px; color: var(--text-sub); margin-top: 2px; }
  .slot.selected { border-color: var(--navy); background: #eef1f7; }
  .slot.selected .time { color: var(--navy); }
  .slot.full { background: #f1f2f4; color: var(--full); cursor: not-allowed; }
  .slot.full .time { color: var(--full); }
  .slot.full .remain { color: var(--full); }
  label.field-label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
  input[type="text"], input[type="tel"], input[type="number"] {
    width: 100%; padding: 11px 12px; border: 1px solid var(--gray-border);
    border-radius: 9px; font-size: 14px; background: #fafbfc;
  }
  .btn {
    width: 100%; padding: 14px; border: none; border-radius: 10px;
    background: var(--navy); color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 18px;
  }
  .btn:disabled { background: #a9b2c3; cursor: not-allowed; }
  .btn.secondary { background: #fff; color: var(--navy); border: 1.5px solid var(--navy); }
  .notice {
    font-size: 12.5px; color: var(--text-sub); line-height: 1.6; margin-top: 10px;
    background: #f7f8fa; border-radius: 9px; padding: 10px 12px;
  }
  .status-msg {
    text-align: center; padding: 40px 16px; font-size: 14px; color: var(--text-sub);
  }
  .result-box {
    text-align: center; padding: 10px 4px 4px;
  }
  .result-box .big { font-size: 17px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .tabbar {
    display: flex; gap: 8px; max-width: 480px; margin: 0 auto 10px; padding: 0 16px;
  }
  .tabbar button {
    flex: 1; padding: 10px; border-radius: 9px; border: 1px solid var(--gray-border);
    background: #fff; font-size: 13.5px; font-weight: 600; color: var(--text-sub); cursor: pointer;
  }
  .tabbar button.active { background: var(--navy-dark); border-color: var(--navy-dark); color: #fff; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>호반써밋 엘리트시티 선착순 방문예약</h1>
  <p id="bookingPeriodText">예약 기간 불러오는 중...</p>
</header>

<div class="tabbar">
  <button id="tabNew" class="active" onclick="switchTab('new')">예약 신청</button>
  <button id="tabLookup" onclick="switchTab('lookup')">예약 조회·취소</button>
</div>

<div class="wrap">

  <div class="card">
    <table class="info-table">
      <tr><th>장 소</th><td id="locationText">-</td></tr>
      <tr><th>시 간</th><td id="hoursText">-</td></tr>
      <tr><th>문 의</th><td id="contactText">-</td></tr>
    </table>
  </div>

  <!-- ===== 예약 신청 ===== -->
  <div id="panelNew">
    <div class="card">
      <div class="section-title">방문 일자 선택 <span class="badge" id="dateBadge"></span></div>
      <div class="date-tabs" id="dateTabs"></div>

      <div class="section-title" style="margin-top:4px;">시간대 선택</div>
      <div class="slot-grid" id="slotGrid"></div>
      <div class="notice">슬롯당 최대 예약 가능 팀 수를 초과하면 선택할 수 없습니다. 선착순으로 마감됩니다.</div>
    </div>

    <div class="card">
      <div class="section-title">예약자 정보</div>
      <label class="field-label">예약자명</label>
      <input type="text" id="inputName" placeholder="예: 홍길동" />
      <label class="field-label">연락처</label>
      <input type="tel" id="inputPhone" placeholder="010-0000-0000" />
      <label class="field-label">방문 인원 수</label>
      <input type="number" id="inputHeadcount" min="1" max="10" value="1" />

      <button class="btn" id="submitBtn" onclick="submitReservation()">예약 신청하기</button>
    </div>
  </div>

  <!-- ===== 예약 조회/취소 ===== -->
  <div id="panelLookup" class="hidden">
    <div class="card">
      <div class="section-title">예약 조회</div>
      <label class="field-label">예약 시 등록한 연락처</label>
      <input type="tel" id="lookupPhone" placeholder="010-0000-0000" />
      <button class="btn" onclick="lookupReservation()">조회하기</button>
      <div id="lookupResult"></div>
    </div>
  </div>

</div>

<script src="config.js"></script>
<script>
let selectedDate = null;
let selectedSlot = null;
let slotStatusCache = {}; // { date: [{time, remain, max}, ...] }

function pad(n){ return String(n).padStart(2,"0"); }

function fmtDateLabel(iso){
  const d = new Date(iso + "T00:00:00+09:00");
  const days = ["일","월","화","수","목","금","토"];
  return `${d.getMonth()+1}.${d.getDate()}(${days[d.getDay()]})`;
}

function fmtDateTimeKST(iso){
  const d = new Date(iso);
  return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function isBookingOpenNow(){
  const now = new Date();
  const open = new Date(CONFIG.BOOKING_OPEN);
  const close = new Date(CONFIG.BOOKING_CLOSE);
  return now >= open && now <= close;
}

function initStaticInfo(){
  document.getElementById("locationText").textContent = CONFIG.LOCATION;
  document.getElementById("hoursText").textContent =
    `${CONFIG.OPEN_TIME} ~ ${CONFIG.CLOSE_TIME} (점심시간 ${CONFIG.LUNCH_START}~${CONFIG.LUNCH_END} 제외)`;
  document.getElementById("contactText").textContent = CONFIG.CONTACT || "현장 사무실로 문의";

  const open = new Date(CONFIG.BOOKING_OPEN);
  const close = new Date(CONFIG.BOOKING_CLOSE);
  const text = `예약 기간: ${fmtDateTimeKST(CONFIG.BOOKING_OPEN).split(" ")[0]} ~ ${fmtDateTimeKST(CONFIG.BOOKING_CLOSE).split(" ")[0]}`;
  document.getElementById("bookingPeriodText").textContent = text;

  if (!isBookingOpenNow()){
    document.getElementById("submitBtn").disabled = true;
  }

  const dateTabs = document.getElementById("dateTabs");
  dateTabs.innerHTML = "";
  CONFIG.VISIT_DATES.forEach((iso, idx) => {
    const btn = document.createElement("div");
    btn.className = "date-tab" + (idx === 0 ? " active" : "");
    btn.textContent = fmtDateLabel(iso);
    btn.onclick = () => selectDate(iso, btn);
    dateTabs.appendChild(btn);
  });
  selectedDate = CONFIG.VISIT_DATES[0];
}

function selectDate(iso, btnEl){
  selectedDate = iso;
  selectedSlot = null;
  document.querySelectorAll(".date-tab").forEach(el => el.classList.remove("active"));
  btnEl.classList.add("active");
  renderSlots();
}

async function fetchAvailability(){
  // GAS doGet: ?action=availability
  const res = await fetch(`${CONFIG.API_URL}?action=availability`);
  const data = await res.json();
  slotStatusCache = data.availability || {};
}

function renderSlots(){
  const grid = document.getElementById("slotGrid");
  grid.innerHTML = "";
  const daySlots = buildDaySlots(CONFIG);
  const statusForDate = slotStatusCache[selectedDate] || {};

  daySlots.forEach(time => {
    const info = statusForDate[time] || { remain: CONFIG.MAX_TEAMS_PER_SLOT, max: CONFIG.MAX_TEAMS_PER_SLOT };
    const full = info.remain <= 0;
    const el = document.createElement("div");
    el.className = "slot" + (full ? " full" : "") + (selectedSlot === time ? " selected" : "");
    el.innerHTML = `<div class="time">${time}</div><div class="remain">${full ? "마감" : `잔여 ${info.remain}팀`}</div>`;
    if (!full){
      el.onclick = () => {
        selectedSlot = time;
        renderSlots();
      };
    }
    grid.appendChild(el);
  });
}

async function submitReservation(){
  if (!isBookingOpenNow()){
    alert("현재는 예약 신청 기간이 아닙니다.");
    return;
  }
  if (!selectedDate || !selectedSlot){
    alert("방문 일자와 시간대를 선택해주세요.");
    return;
  }
  const name = document.getElementById("inputName").value.trim();
  const phone = document.getElementById("inputPhone").value.trim();
  const headcount = Number(document.getElementById("inputHeadcount").value || 1);

  if (!name || !phone){
    alert("예약자명과 연락처를 입력해주세요.");
    return;
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  btn.textContent = "처리 중...";

  try {
    const res = await fetch(CONFIG.API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // CORS 프리플라이트 회피
      body: JSON.stringify({
        action: "reserve",
        date: selectedDate,
        slot: selectedSlot,
        name, phone, headcount
      })
    });
    const data = await res.json();
    if (data.ok){
      alert(`예약이 완료되었습니다.\n${fmtDateLabel(selectedDate)} ${selectedSlot}`);
      selectedSlot = null;
      await fetchAvailability();
      renderSlots();
      document.getElementById("inputName").value = "";
      document.getElementById("inputPhone").value = "";
      document.getElementById("inputHeadcount").value = 1;
    } else {
      alert(data.message || "예약에 실패했습니다. 다시 시도해주세요.");
      await fetchAvailability();
      renderSlots();
    }
  } catch (err){
    alert("네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
  } finally {
    btn.disabled = !isBookingOpenNow() ? true : false;
    btn.textContent = "예약 신청하기";
  }
}

async function lookupReservation(){
  const phone = document.getElementById("lookupPhone").value.trim();
  if (!phone){
    alert("연락처를 입력해주세요.");
    return;
  }
  const box = document.getElementById("lookupResult");
  box.innerHTML = `<div class="status-msg">조회 중...</div>`;
  try {
    const res = await fetch(`${CONFIG.API_URL}?action=lookup&phone=${encodeURIComponent(phone)}`);
    const data = await res.json();
    if (!data.ok || !data.items || data.items.length === 0){
      box.innerHTML = `<div class="status-msg">조회된 예약이 없습니다.</div>`;
      return;
    }
    box.innerHTML = data.items.map(item => `
      <div class="card result-box" style="margin-top:12px;">
        <div class="big">${fmtDateLabel(item.date)} ${item.slot}</div>
        <div style="font-size:13px;color:var(--text-sub);margin-bottom:10px;">
          예약자 ${item.name} / 인원 ${item.headcount}명 / 상태 ${item.status}
        </div>
        ${item.status === "예약" ? `<button class="btn secondary" onclick="cancelReservation('${item.id}','${item.phone}')">예약 취소</button>` : ""}
      </div>
    `).join("");
  } catch(err){
    box.innerHTML = `<div class="status-msg">조회 중 오류가 발생했습니다.</div>`;
  }
}

async function cancelReservation(id, phone){
  if (!confirm("예약을 취소하시겠습니까?")) return;
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "cancel", id, phone })
    });
    const data = await res.json();
    if (data.ok){
      alert("예약이 취소되었습니다.");
      lookupReservation();
    } else {
      alert(data.message || "취소에 실패했습니다.");
    }
  } catch(err){
    alert("네트워크 오류가 발생했습니다.");
  }
}

function switchTab(tab){
  document.getElementById("tabNew").classList.toggle("active", tab === "new");
  document.getElementById("tabLookup").classList.toggle("active", tab === "lookup");
  document.getElementById("panelNew").classList.toggle("hidden", tab !== "new");
  document.getElementById("panelLookup").classList.toggle("hidden", tab !== "lookup");
}

(async function init(){
  initStaticInfo();
  document.getElementById("slotGrid").innerHTML = `<div class="status-msg">예약 현황을 불러오는 중...</div>`;
  try {
    await fetchAvailability();
  } catch(err){ /* API_URL 설정 전이면 무시 */ }
  renderSlots();
})();
</script>
</body>
</html>
